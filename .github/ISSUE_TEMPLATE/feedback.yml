name: Feedback
description: Something you noticed or want, in your own words. The main agent turns it into smaller issues.
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, or what do you want?
      description: Write it as it comes. Screenshots can be pasted in.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: "`omp-app --version`. Leave empty if you don't know."
