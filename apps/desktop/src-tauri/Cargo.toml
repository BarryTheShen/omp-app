[package]
name = "omp-app-desktop"
version = "0.1.0"
description = "omp app: a desktop window around the omp app's server"
edition = "2021"
default-run = "omp-app-desktop"
publish = false

[[bin]]
name = "omp-app-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
libc = "0.2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The window's own webview (the one Tauri uses on Linux), to show the error page when a page does not open (see
# `watch_page_loads` in server.rs). `v2_6` brings the signal for a certificate that is not accepted.
webkit2gtk = { version = "2", features = ["v2_6"] }
