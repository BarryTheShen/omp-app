<!doctype html>
<html lang="en" data-theme="tern-dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- cover: the page reaches the screen's edges; the app pads itself by the safe areas (styles/index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Add to Home Screen: the app's name, icon and full-screen launch. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="omp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Older iOS: drawn under the status bar, as iOS 26 and later draw every Home Screen app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>omp</title>
    <script>
      // The kept theme before the first paint; src/theme/theme.ts keeps it current afterwards (same keys and rule): the
      // choice, the mode of a chosen theme, and the light and the dark theme that "system" follows.
      (() => {
        const read = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const choice = read("omp-app.ui.theme") ?? "tern-dark";
        let theme = choice;
        let dark = read("omp-app.ui.theme.mode") !== "light";
        if (choice === "system") {
          dark = !matchMedia("(prefers-color-scheme: light)").matches;
          theme =
            read(dark ? "omp-app.ui.theme.dark" : "omp-app.ui.theme.light") ??
            (dark ? "tern-dark" : "tern-light");
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
