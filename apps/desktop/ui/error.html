<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp app</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1f2328;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.4rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
      }
      code {
        font-size: 0.95em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f2328;
          color: #e6edf3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>omp app could not start</h1>
      <p>
        The app's server did not start, or it stopped on its own. Close this window and open omp
        app again.
      </p>
      <p>
        If it keeps happening, the log that says what went wrong is in
        <code>~/.local/state/omp-app/omp-app.log</code>.
      </p>
    </main>
  </body>
</html>
