<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp app</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1f2328;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.4rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f2328;
          color: #e6edf3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Starting omp app</h1>
      <p>This can take a few seconds, and up to a minute the first time, while omp sets itself up.</p>
    </main>
  </body>
</html>
