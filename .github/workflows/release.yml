# Release: builds the installable packages of main twice a day, and only when
# the product changed since the last release. There are two packages of the same version: the window
# (omp-app-desktop: the "omp app" window with its bundled server) and the terminal command (omp-app,
# which opens the app in the browser). The release page lists both, and what changed.
#
#   scheduled: 01:23 and 13:23 UTC (8:23 PM and 8:23 AM US Central in summer, 7:23 PM and 7:23 AM in winter). Off the
#              hour: GitHub delays scheduled runs at the start of an hour, when it is busiest, and may drop them.
#   by hand:   gh workflow run release.yml            (add -f force=true to build without changes)
#
# "Changed" means a file under apps/, packages/ or packaging/, or bun.lock, package.json or
# tsconfig.base.json, differs from the commit of the latest release. The version is
# 0.3.<number of commits on main>, so it only goes up and names exactly one commit (0.3 since this repository's history
# starts anew, with fewer commits than the last 0.2 release had).
# Each package is smoke-tested before anything is published: when a test fails, the release fails and
# nothing is published.
# The workflow only ever builds main and writes only releases and tags (contents: write).
# It runs on GitHub's hosted Ubuntu 24.04 runner, and installs the libraries the window needs below.
# This workflow only starts from the schedule or by hand, never from a pull request, so it never runs untrusted code.
name: release

on:
  schedule:
    - cron: "23 1,13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed since the last release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main with its history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Nothing below pushes with git (the release is made through `gh` with its own token): keep no credentials
          # in the checkout, where the build's scripts could read them.
          persist-credentials: false

      - name: Decide whether anything changed since the last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version="0.3.$(git rev-list --count HEAD)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "last=$last" >>"$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "v$version is already released."
          elif [[ -z $last || $FORCE == true ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          elif git diff --quiet "$last^{commit}" HEAD -- apps packages packaging bun.lock package.json tsconfig.base.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Nothing in the product changed since $last: no build."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # Only GitHub-owned actions are allowed in this repository, so Bun comes straight from its
      # official release, pinned to a version and checked against the release's checksum file.
      - name: Install Bun 1.3.14
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download bun-v1.3.14 --repo oven-sh/bun --pattern bun-linux-x64.zip --pattern SHASUMS256.txt
          grep ' bun-linux-x64.zip$' SHASUMS256.txt | sha256sum -c -
          unzip -q bun-linux-x64.zip
          mkdir -p "$HOME/.bun/bin"
          install -m 0755 bun-linux-x64/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      # The chat host (packages/server/scripts/build-chat-host.ts) is compiled by the Bun omp's release is built with,
      # which that script names; on Bun 1.3.14 each chat kept about 130 MB more memory. The build scripts read CHAT_HOST_BUN.
      - name: Install Bun 1.4.3 for the chat host
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chat-host-bun"
          cd "$RUNNER_TEMP/chat-host-bun"
          gh release download bun-v1.4.3 --repo oven-sh/bun --pattern bun-linux-x64.zip --pattern SHASUMS256.txt
          grep ' bun-linux-x64.zip$' SHASUMS256.txt | sha256sum -c -
          unzip -q bun-linux-x64.zip
          echo "CHAT_HOST_BUN=$RUNNER_TEMP/chat-host-bun/bun-linux-x64/bun" >>"$GITHUB_ENV"
          "$RUNNER_TEMP/chat-host-bun/bun-linux-x64/bun" --version

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Build the package
        if: steps.changes.outputs.changed == 'true'
        run: bash packaging/build-deb.sh "${{ steps.changes.outputs.version }}"

      - name: Check that the package works
        if: steps.changes.outputs.changed == 'true'
        run: bash packaging/smoke-test.sh "dist/release/omp-app_${{ steps.changes.outputs.version }}_amd64.deb"

      # The window (omp-app-desktop) is built and checked the way desktop.yml does it: the libraries
      # Tauri 2 needs, Rust, the Cargo cache, the package, then a smoke test under a virtual display that
      # opens the app, closes it, and leaves nothing behind.
      - name: Install the libraries the window needs, and its smoke test's tools
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # A runner image that has these already skips the install; a plain Ubuntu runner gets them installed.
          if dpkg -s libwebkit2gtk-4.1-dev xvfb xauth xdotool imagemagick dbus-x11 desktop-file-utils >/dev/null 2>&1; then
            echo "The runner already has the libraries."
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth xdotool imagemagick dbus dbus-x11 desktop-file-utils
          fi

      # rustup, pinned to a version and checked against the checksum it was published with (as Bun is above), then
      # the stable toolchain.
      - name: Install Rust (stable)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
          echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  rustup-init" | sha256sum -c -
          chmod 0755 rustup-init
          ./rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Cache the Cargo registry and the window's build
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-

      - name: Build the window's package
        if: steps.changes.outputs.changed == 'true'
        run: bash packaging/build-desktop-deb.sh "${{ steps.changes.outputs.version }}"

      - name: Check that the window's package works
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash packaging/desktop-smoke-test.sh "dist/desktop/omp-app-desktop_${{ steps.changes.outputs.version }}_amd64.deb"

      - name: Add the window's package and its checksum to the release
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/desktop/omp-app-desktop_${VERSION}_amd64.deb" dist/release/
          (cd dist/release && sha256sum "omp-app-desktop_${VERSION}_amd64.deb" >>SHA256SUMS)
          cat dist/release/SHA256SUMS

      - name: Build the Firefox and Zen extension, and have Mozilla sign it
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.changes.outputs.version }}
          # An addons.mozilla.org API key (Developer Hub → Tools → Manage API Keys) as the repository's Actions secrets;
          # without them the release has the unsigned extension only.
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          bun run --cwd apps/zen build "$VERSION"
          # Unsigned: Firefox and Zen load it for one session (about:debugging → Load Temporary Add-on).
          (cd apps/zen/dist && zip -qr "$GITHUB_WORKSPACE/dist/release/omp-app-zen_${VERSION}_unsigned.zip" .)
          (cd dist/release && sha256sum "omp-app-zen_${VERSION}_unsigned.zip" >>SHA256SUMS)
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "No addons.mozilla.org key: the release has the unsigned extension only."
            exit 0
          fi
          # Mozilla's own checks first, then signing for self-distribution ("unlisted"), which Zen keeps installed. The
          # source that builds it goes along, for Mozilla's review. Neither stops the release: the app's packages are out
          # either way, and the unsigned extension is attached.
          git archive --format=zip -o "$RUNNER_TEMP/zen-source.zip" HEAD \
            apps/zen packages/embed packages/contracts package.json bun.lock tsconfig.base.json
          if npx --yes web-ext@10.8.0 lint --source-dir apps/zen/dist \
            && npx --yes web-ext@10.8.0 sign --channel unlisted --source-dir apps/zen/dist \
              --artifacts-dir "$RUNNER_TEMP/zen-signed" --upload-source-code "$RUNNER_TEMP/zen-source.zip" \
              --approval-timeout 900000; then
            cp "$RUNNER_TEMP"/zen-signed/*.xpi "dist/release/omp-app-zen_${VERSION}.xpi"
            (cd dist/release && sha256sum "omp-app-zen_${VERSION}.xpi" >>SHA256SUMS)
          else
            echo "::warning::Mozilla did not sign the extension; the release has the unsigned one only."
          fi
          ls -l dist/release

      - name: Write the release notes
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.changes.outputs.version }}
          LAST: ${{ steps.changes.outputs.last }}
        run: bash packaging/release-notes.sh "$VERSION" "$LAST" dist/release/notes.md

      - name: Publish the release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          # The tag names the commit that was built: main when this job checked it out, which may be newer than the
          # commit the run was started on ($GITHUB_SHA).
          assets=(
            "dist/release/omp-app_${VERSION}_amd64.deb"
            "dist/release/omp-app-desktop_${VERSION}_amd64.deb"
            "dist/release/omp-app-zen_${VERSION}_unsigned.zip"
          )
          if [ -f "dist/release/omp-app-zen_${VERSION}.xpi" ]; then
            assets+=("dist/release/omp-app-zen_${VERSION}.xpi")
          fi
          gh release create "v$VERSION" "${assets[@]}" dist/release/SHA256SUMS \
            --target "$(git rev-parse HEAD)" --title "omp app $VERSION" --notes-file dist/release/notes.md
