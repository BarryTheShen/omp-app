# omp-app off Linux (P2 of the platforms plan): the typecheck, the contracts' tests and the server's tests on macOS and
# Windows, as GitHub's own runners have them, then the app's command and chat host built for that system and started.
# Runs on pushes to main that change the server, the contracts, the lockfile or this file, on pushes to ci/platforms
# (for trying a fix there first), and by hand. Only GitHub-owned actions are used, so Bun comes from its official
# release, checked against the release's checksum file, as release.yml installs it.
# First run (2026-11-20): typecheck and contracts passed on both; server tests: macOS 1465 pass / 7 fail, Windows 1110 /
# 362. All pass since #60 (2026-11-21).
name: platforms

on:
  push:
    branches: [main, ci/platforms]
    paths:
      - packages/server/**
      - packages/contracts/**
      - bun.lock
      - .github/workflows/platforms.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bun: bun-darwin-aarch64
          - os: windows-latest
            bun: bun-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun 1.3.14
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.bun }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download bun-v1.3.14 --repo oven-sh/bun --pattern "$ASSET.zip" --pattern SHASUMS256.txt
          grep " $ASSET.zip\$" SHASUMS256.txt | (command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -)
          unzip -q "$ASSET.zip"
          echo "$RUNNER_TEMP/$ASSET" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/$ASSET/bun" --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Contracts' tests
        run: bun test
        working-directory: packages/contracts

      - name: Server's tests
        run: bun test 2>&1 | tee "$RUNNER_TEMP/server-tests.txt"
        working-directory: packages/server

      - name: Install Bun 1.4.4 for the chat host
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.bun }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chat-host-bun"
          cd "$RUNNER_TEMP/chat-host-bun"
          gh release download bun-v1.4.4 --repo oven-sh/bun --pattern "$ASSET.zip" --pattern SHASUMS256.txt
          grep " $ASSET.zip\$" SHASUMS256.txt | (command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -)
          unzip -q "$ASSET.zip"
          echo "CHAT_HOST_BUN=$RUNNER_TEMP/chat-host-bun/$ASSET/bun" >>"$GITHUB_ENV"

      - name: Build the app's command and its chat host for this system
        run: |
          set -euo pipefail
          "$CHAT_HOST_BUN" packages/server/scripts/build-chat-host.ts "$RUNNER_TEMP/app/chat-host"
          bun packages/server/scripts/build-server.ts 0.0.0-ci "$RUNNER_TEMP/app/omp-app"
          ls -la "$RUNNER_TEMP/app"

      - name: Start the built app and load its page
        run: bun packages/server/scripts/smoke-compiled.ts "$RUNNER_TEMP/app" 0.0.0-ci

      - name: What failed, in the run's summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}: server tests that failed"
            grep -E '^\(fail\)' "$RUNNER_TEMP/server-tests.txt" | sed 's/^/- /' | head -200 || true
            grep -E '^ *[0-9]+ (pass|fail)$' "$RUNNER_TEMP/server-tests.txt" || true
          } >>"$GITHUB_STEP_SUMMARY"
